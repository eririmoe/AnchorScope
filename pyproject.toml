[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "AnchorScope"
version = "0.1.0"
description = "Anchor-aware FASTQ QC for single-cell long-read libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.60.0",
]

[project.scripts]
anchorscope = "anchorscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
